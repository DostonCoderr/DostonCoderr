<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020202"/>
      <stop offset="55%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6d1f"/>
      <stop offset="50%" stop-color="#f2d675"/>
      <stop offset="100%" stop-color="#8a6d1f"/>
    </linearGradient>

    <radialGradient id="radarGrad" cx="0%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#d4af37" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="340" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .col { font-family: 'Courier New', monospace; font-size: 14px; fill: #d4af37; }
    .rain { animation: fall linear infinite; }
    @keyframes fall {
      0%   { transform: translateY(-320px); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; filter: drop-shadow(0 0 2px #d4af37); }
      50%      { opacity: 1;    filter: drop-shadow(0 0 14px #f2d675); }
    }
    .blink { animation: blink 1s step-start infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .dot { animation: dotpulse 1.6s ease-in-out infinite; }
    @keyframes dotpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .type {
      font-family: 'Courier New', monospace; font-size: 20px; fill: #b8b8b0;
      overflow: hidden; white-space: nowrap;
      animation: typing 3.5s steps(38, end) infinite;
    }
    @keyframes typing {
      0%   { clip-path: inset(0 100% 0 0); }
      55%  { clip-path: inset(0 0 0 0); }
      90%  { clip-path: inset(0 0 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- radar sweep -->
    <g transform="translate(120,170)">
      <path d="M0,0 L0,-260 A260,260 0 0,1 225,-130 Z" fill="url(#radarGrad)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#f2d675" class="pulse"/>
      <circle r="70" fill="none" stroke="#d4af37" stroke-opacity="0.15"/>
      <circle r="140" fill="none" stroke="#d4af37" stroke-opacity="0.1"/>
      <circle r="210" fill="none" stroke="#d4af37" stroke-opacity="0.06"/>
    </g>

    <!-- matrix rain columns -->
    <g class="col">
      <text class="rain" x="60"  y="0" style="animation-duration:5.2s; animation-delay:-1s">01 A9 F3</text>
      <text class="rain" x="980" y="0" style="animation-duration:6.1s; animation-delay:-2.5s">7C 0E B1</text>
      <text class="rain" x="1040" y="0" style="animation-duration:4.6s; animation-delay:-0.4s">D4 AF 37</text>
      <text class="rain" x="1100" y="0" style="animation-duration:7s;   animation-delay:-3.2s">SEC 0x1F</text>
      <text class="rain" x="900"  y="0" style="animation-duration:5.7s; animation-delay:-1.8s">FF 8B 22</text>
    </g>

    <!-- status line top -->
    <g transform="translate(36,34)" font-family="Courier New, monospace" font-size="13" fill="#8a8a80">
      <circle cx="0" cy="-4" r="4" fill="#e0b84a" class="dot"/>
      <text x="14" y="0">SYSTEM ONLINE // DOSTON.DEV</text>
    </g>

    <!-- main title -->
    <g transform="translate(600,150)" text-anchor="middle">
      <text font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="6" fill="url(#gold)" filter="url(#glow)" class="pulse">
        DOSTON OTKUROV
      </text>
    </g>

    <!-- typed subtitle -->
    <g transform="translate(600,205)" text-anchor="middle">
      <text class="type" x="-260" y="0">&gt; frontend.dev({ react, nextjs, threejs })_</text>
    </g>

    <!-- bottom divider -->
    <line x1="300" y1="250" x2="900" y2="250" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.5"/>

    <!-- scan line moving -->
    <rect x="0" y="0" width="1200" height="6" fill="url(#scanGrad)">
      <animate attributeName="y" values="0;334;0" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- corner brackets -->
    <path d="M20,20 L20,50 M20,20 L50,20" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M1180,20 L1180,50 M1180,20 L1150,20" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M20,320 L20,290 M20,320 L50,320" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M1180,320 L1180,290 M1180,320 L1150,320" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
</svg>
