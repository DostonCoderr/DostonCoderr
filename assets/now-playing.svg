<svg width="420" height="86" viewBox="0 0 420 86" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="npbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020402"/>
      <stop offset="100%" stop-color="#061309"/>
    </linearGradient>
  </defs>
  <style>
    .bar { fill: #00ff9d; transform-box: fill-box; transform-origin: bottom; animation: bounce 1.1s ease-in-out infinite; }
    @keyframes bounce {
      0%,100% { transform: scaleY(0.25); }
      50%     { transform: scaleY(1); }
    }
    .label { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 2px; fill: #6dab8c; }
    .title { font-family: 'Courier New', monospace; font-size: 16px; fill: #d8fff0; font-weight: bold; }
    .artist { font-family: 'Courier New', monospace; font-size: 12px; fill: #7ad9b8; }
    .dot { animation: dotpulse 1.6s ease-in-out infinite; }
    @keyframes dotpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
  </style>

  <rect x="1" y="1" width="418" height="84" rx="12" fill="url(#npbg)" stroke="#00ff9d" stroke-opacity="0.35"/>

  <circle cx="24" cy="20" r="4" fill="#00ff9d" class="dot"/>
  <text x="36" y="24" class="label">NOW PLAYING</text>

  <text x="20" y="50" class="title">Freeman</text>
  <text x="20" y="68" class="artist">MiyaGi &amp; Andy Panda</text>

  <g transform="translate(354,30)">
    <rect class="bar" x="0"  y="0" width="6" height="30" style="animation-delay:-0.9s"/>
    <rect class="bar" x="10" y="0" width="6" height="30" style="animation-delay:-0.5s"/>
    <rect class="bar" x="20" y="0" width="6" height="30" style="animation-delay:-1.1s"/>
    <rect class="bar" x="30" y="0" width="6" height="30" style="animation-delay:-0.2s"/>
    <rect class="bar" x="40" y="0" width="6" height="30" style="animation-delay:-0.7s"/>
  </g>
</svg>
