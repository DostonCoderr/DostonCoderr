<svg width="460" height="90" viewBox="0 0 460 90" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020402"/>
      <stop offset="100%" stop-color="#061309"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'Courier New', monospace; }
    .label { fill: #6dab8c; font-size: 11px; letter-spacing: 2px; }
    .title { fill: #d8fff0; font-size: 16px; font-weight: bold; }
    .sub { fill: #7ad9b8; font-size: 12px; }
    .dot { animation: dp 1.6s ease-in-out infinite; }
    @keyframes dp { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    .bar { fill: #00ff9d; }
    .fill { animation: load 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes load {
      0%   { transform: scaleX(0.15); }
      50%  { transform: scaleX(0.85); }
      100% { transform: scaleX(0.15); }
    }
    .pad { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>

  <rect x="1" y="1" width="458" height="88" rx="12" fill="url(#gbg)" stroke="#00ff9d" stroke-opacity="0.35"/>

  <!-- controller icon -->
  <g transform="translate(24,28)" class="pad">
    <rect x="0" y="6" width="34" height="18" rx="8" fill="none" stroke="#00ff9d" stroke-width="2"/>
    <circle cx="8" cy="15" r="2.4" fill="#00ff9d"/>
    <circle cx="26" cy="12" r="2" fill="#00ff9d"/>
    <circle cx="30" cy="17" r="2" fill="#00ff9d"/>
  </g>

  <text x="72" y="22" class="mono label">STATUS</text>
  <text x="72" y="42" class="mono title">Currently Grinding</text>
  <text x="72" y="60" class="mono sub">Counter-Strike 2 // Competitive</text>

  <g transform="translate(300,52)">
    <text x="0" y="-8" class="mono label">RANK PROGRESS</text>
    <rect x="0" y="0" width="130" height="8" rx="4" fill="#0d1f16"/>
    <rect x="0" y="0" width="130" height="8" rx="4" class="bar fill"/>
  </g>
</svg>
