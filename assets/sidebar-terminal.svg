<svg width="460" height="520" viewBox="0 0 460 520" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020402"/>
      <stop offset="100%" stop-color="#061309"/>
    </linearGradient>
    <pattern id="tgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ff9d" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'Courier New', monospace; }
    .prompt { fill: #00ff9d; font-weight: bold; }
    .out { fill: #b7ffe0; }
    .dim { fill: #6dab8c; }
    .line { opacity: 0; animation: reveal 11s infinite; }
    @keyframes reveal {
      0%   { opacity: 0; }
      4%   { opacity: 1; }
      92%  { opacity: 1; }
      97%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .cursor { animation: blink 1s step-start infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .dot { animation: dp 1.8s ease-in-out infinite; }
    @keyframes dp { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  </style>

  <rect x="1" y="1" width="458" height="518" rx="14" fill="url(#tbg)" stroke="#00ff9d" stroke-opacity="0.35"/>
  <rect x="1" y="1" width="458" height="518" rx="14" fill="url(#tgrid)"/>

  <!-- title bar -->
  <rect x="1" y="1" width="458" height="34" rx="14" fill="#03110a"/>
  <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="18" r="5" fill="#27c93f"/>
  <text x="230" y="22" text-anchor="middle" class="mono dim" font-size="12">zero-trace@security:~</text>

  <g class="mono" font-size="15" transform="translate(24,74)">
    <text class="line" x="0" y="0"  style="animation-delay:0s"><tspan class="prompt">$</tspan> <tspan class="out">whoami</tspan></text>
    <text class="line" x="0" y="26" style="animation-delay:0.5s"><tspan class="dim">&gt;</tspan> <tspan class="out">zero-trace</tspan></text>

    <text class="line" x="0" y="70" style="animation-delay:1.4s"><tspan class="prompt">$</tspan> <tspan class="out">role --list</tspan></text>
    <text class="line" x="0" y="96"  style="animation-delay:2.0s"><tspan class="dim">&gt;</tspan> <tspan class="out">Full-Stack Developer</tspan></text>
    <text class="line" x="0" y="122" style="animation-delay:2.4s"><tspan class="dim">&gt;</tspan> <tspan class="out">DevOps Engineer</tspan></text>
    <text class="line" x="0" y="148" style="animation-delay:2.8s"><tspan class="dim">&gt;</tspan> <tspan class="out">Cyber Security Specialist</tspan></text>
    <text class="line" x="0" y="174" style="animation-delay:3.2s"><tspan class="dim">&gt;</tspan> <tspan class="out">AI Engineer</tspan></text>

    <text class="line" x="0" y="218" style="animation-delay:4.2s"><tspan class="prompt">$</tspan> <tspan class="out">status --check</tspan></text>
    <text class="line" x="0" y="244" style="animation-delay:4.8s"><tspan class="dim">&gt;</tspan> <tspan class="out">all systems nominal</tspan></text>

    <text class="line" x="0" y="288" style="animation-delay:5.6s"><tspan class="prompt">$</tspan> <tspan class="out">cat motto.txt</tspan></text>
    <text class="line" x="0" y="314" style="animation-delay:6.2s"><tspan class="dim">&gt;</tspan> <tspan class="out" font-style="italic">"Trust nothing. Verify everything."</tspan></text>

    <g class="line" style="animation-delay:7.2s">
      <circle cx="4" cy="352" r="4" fill="#00ff9d" class="dot"/>
      <text x="16" y="356"><tspan class="dim">connection secure</tspan></text>
    </g>
    <g class="line" style="animation-delay:7.6s">
      <text x="0" y="378"><tspan class="dim">trust: none / verify: always</tspan></text>
    </g>

    <text x="0" y="416" class="prompt line" style="animation-delay:8.4s">$<tspan class="cursor"> _</tspan></text>
  </g>
</svg>
