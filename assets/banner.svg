<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010301"/>
      <stop offset="55%" stop-color="#050805"/>
      <stop offset="100%" stop-color="#020402"/>
    </linearGradient>
    <radialGradient id="radarGrad" cx="0%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#00ff9d" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="380" rx="14"/></clipPath>
  </defs>

  <style>
    .col { font-family: 'Courier New', monospace; font-size: 14px; fill: #00ff9d; }
    .rain { animation: fall linear infinite; }
    @keyframes fall {
      0%   { transform: translateY(-360px); opacity: 0; }
      10%  { opacity: 0.45; }
      90%  { opacity: 0.45; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; filter: drop-shadow(0 0 2px #00ff9d); }
      50%      { opacity: 1;    filter: drop-shadow(0 0 16px #6dffc4); }
    }
    .dot { animation: dotpulse 1.6s ease-in-out infinite; }
    @keyframes dotpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

    .glitch { font-family: 'Courier New', monospace; font-weight: 700; font-size: 66px; letter-spacing: 6px; }
    .g-base { fill: #00ff9d; }
    .g-red  { fill: #ff2b6b; opacity: 0; animation: glitch1 3.2s infinite; }
    .g-cyan { fill: #2bd9ff; opacity: 0; animation: glitch2 3.2s infinite; }
    @keyframes glitch1 {
      0%,40%,100% { transform: translate(0,0); opacity: 0; }
      42% { transform: translate(-4px,1px); opacity: 0.75; }
      44% { transform: translate(3px,-1px); opacity: 0.75; }
      46% { transform: translate(0,0); opacity: 0; }
    }
    @keyframes glitch2 {
      0%,50%,100% { transform: translate(0,0); opacity: 0; }
      52% { transform: translate(4px,-1px); opacity: 0.75; }
      54% { transform: translate(-3px,1px); opacity: 0.75; }
      56% { transform: translate(0,0); opacity: 0; }
    }

    .boot { font-family: 'Courier New', monospace; font-size: 17px; fill: #b7ffe0; opacity: 0; animation: bootline 6s infinite; }
    @keyframes bootline {
      0%   { opacity: 0; }
      3%   { opacity: 1; }
      88%  { opacity: 1; }
      94%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .ok { fill: #00ff9d; font-weight: bold; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <g transform="translate(140,190)">
      <path d="M0,0 L0,-280 A280,280 0 0,1 242,-140 Z" fill="url(#radarGrad)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#6dffc4" class="pulse"/>
      <circle r="75" fill="none" stroke="#00ff9d" stroke-opacity="0.15"/>
      <circle r="150" fill="none" stroke="#00ff9d" stroke-opacity="0.1"/>
      <circle r="225" fill="none" stroke="#00ff9d" stroke-opacity="0.06"/>
    </g>

    <g transform="translate(36,34)" font-family="Courier New, monospace" font-size="13" fill="#7ad9b8">
      <circle cx="0" cy="-4" r="4" fill="#00ff9d" class="dot"/>
      <text x="14" y="0">SYSTEM ONLINE // IDENTITY: ZERO-TRACE</text>
    </g>

    <g transform="translate(600,150)" text-anchor="middle" class="glitch">
      <text class="g-base">ZERO-TRACE</text>
      <text class="g-red">ZERO-TRACE</text>
      <text class="g-cyan">ZERO-TRACE</text>
    </g>

    <g transform="translate(600,188)" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#8fae9f">
      <text>Doston Otkurov</text>
    </g>

    <g transform="translate(600,232)" text-anchor="middle">
      <text class="boot" x="0" y="0"  style="animation-delay:0s"><tspan class="ok">[OK]</tspan> Full-Stack Development</text>
      <text class="boot" x="0" y="26" style="animation-delay:1.5s"><tspan class="ok">[OK]</tspan> DevOps &amp; Infrastructure</text>
      <text class="boot" x="0" y="52" style="animation-delay:3s"><tspan class="ok">[OK]</tspan> Cyber Security</text>
      <text class="boot" x="0" y="78" style="animation-delay:4.5s"><tspan class="ok">[OK]</tspan> AI Engineering</text>
    </g>

    <line x1="300" y1="335" x2="900" y2="335" stroke="#00ff9d" stroke-width="1" stroke-opacity="0.35"/>

    <rect x="0" y="0" width="1200" height="6" fill="url(#scanGrad)">
      <animate attributeName="y" values="0;374;0" dur="5s" repeatCount="indefinite"/>
    </rect>

    <path d="M20,20 L20,50 M20,20 L50,20" stroke="#00ff9d" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M1180,20 L1180,50 M1180,20 L1150,20" stroke="#00ff9d" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M20,360 L20,330 M20,360 L50,360" stroke="#00ff9d" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M1180,360 L1180,330 M1180,360 L1150,360" stroke="#00ff9d" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
</svg>
